name: iOS TestFlight

# Archives the native SwiftUI iOS companion app (`ios/Rem.xcodeproj`) backed by
# a Release `RemCore.xcframework` and uploads it directly to App Store Connect /
# TestFlight using Xcode Cloud Signing (App Store Connect API key; no .p12 needed).
#
# Runs automatically on versioned releases (called by release.yml) and can also
# be triggered manually from GitHub Actions (`workflow_dispatch`) for beta builds
# or dry-run archive verification.
on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release git tag to archive and upload (e.g. v0.20.0)'
        required: true
        type: string
      version:
        description: 'Optional marketing version override'
        required: false
        default: ''
        type: string
      internal_only:
        description: 'Restrict build to internal TestFlight testers only'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Archive and verify without uploading to App Store Connect'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version override (defaults to ios/Config/Version.xcconfig)'
        required: false
        default: ''
        type: string
      internal_only:
        description: 'Restrict build to internal TestFlight testers only'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Archive and verify without uploading to App Store Connect'
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-testflight-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & Upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Validate App Store Connect configuration
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for var in APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PRIVATE_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required GitHub secret for TestFlight upload: $var"
              exit 1
            fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ios-device-release

      - name: Build RemCore.xcframework (iOS device release) & Swift bindings
        run: bash tools/build-ios-xcframework.sh --device-only

      - name: Resolve version and build number
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            marketing_version="${INPUT_TAG#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            marketing_version="${INPUT_VERSION#v}"
          else
            marketing_version=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' ios/Config/Version.xcconfig | head -n 1)
          fi
          if [ -z "$marketing_version" ]; then
            echo "::error::Unable to determine MARKETING_VERSION"
            exit 1
          fi
          build_number=$(date -u +%Y%m%d%H%M)
          echo "Resolved iOS version ${marketing_version} (build ${build_number})"
          {
            echo "marketing_version=$marketing_version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"

      - name: Archive Release build
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/Rem.xcodeproj \
            -scheme RemApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Rem.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify archive metadata and App Store readiness
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.marketing_version }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/Rem.xcarchive/Products/Applications/rem.app"
          info_plist="$app_path/Info.plist"
          test -d "$app_path"
          test -f "$info_plist"
          test -f "$app_path/PrivacyInfo.xcprivacy"

          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$info_plist")
          short_ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$info_plist")
          build_ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$info_plist")
          non_exempt=$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$info_plist")
          device_families=$(/usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$info_plist" | tr -d '[:space:]')

          echo "Archived bundle: $bundle_id v$short_ver ($build_ver), ITSAppUsesNonExemptEncryption=$non_exempt, UIDeviceFamily=$device_families"
          test "$bundle_id" = "com.shettyh.rem"
          test "$short_ver" = "$EXPECTED_VERSION"
          test "$build_ver" = "$EXPECTED_BUILD"
          test "$non_exempt" = "false"
          test "$device_families" = "Array{1}"

      - name: Export and upload to TestFlight (Cloud Signing)
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID || 'VB28U48NHS' }}
          INTERNAL_ONLY: ${{ inputs.internal_only }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          api_key_path="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_PRIVATE_KEY" | tr -d '\r' > "$api_key_path"
          chmod 600 "$api_key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$api_key_path"; then
            echo "::error::APPLE_API_KEY_PRIVATE_KEY does not look like a PEM .p8 private key"
            exit 1
          fi

          export_plist="$RUNNER_TEMP/ExportOptions.plist"
          node tools/render-ios-export-options.mjs \
            --team-id "$APPLE_TEAM_ID" \
            --destination upload \
            --internal-only "$INTERNAL_ONLY" \
            --output "$export_plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Rem.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$export_plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$api_key_path" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"

      - name: Clean up App Store Connect credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/ExportOptions.plist"
