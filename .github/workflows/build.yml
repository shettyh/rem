name: Build installers

# Builds desktop installers for every push to main and uploads them as
# workflow artifacts (downloadable from the run page; auto-expire per retention).
# Versioned GitHub Releases are handled separately by release.yml on v* tags.
on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
            artifact: rem-macos
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            bundle: src-tauri/target/release/bundle
            artifact: rem-linux
          - platform: windows-latest
            args: ''
            rust-targets: ''
            bundle: src-tauri/target/release/bundle
            artifact: rem-windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # `tauri build` runs the frontend build (beforeBuildCommand) then bundles.
      - name: Build installers
        run: npx tauri build ${{ matrix.args }}

      - name: Build CLI archives (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/dist-cli
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --manifest-path src-tauri/Cargo.toml --release -p rem-cli --target "$target"
            tar -C "src-tauri/target/$target/release" -czf "src-tauri/dist-cli/rem-cli-$target.tar.gz" rem
          done

      - name: Build CLI archive (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release -p rem-cli
          mkdir -p src-tauri/dist-cli
          tar -C src-tauri/target/release -czf src-tauri/dist-cli/rem-cli-x86_64-unknown-linux-gnu.tar.gz rem

      - name: Build CLI archive (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release -p rem-cli
          New-Item -ItemType Directory -Force src-tauri/dist-cli | Out-Null
          Compress-Archive -Path src-tauri/target/release/rem.exe -DestinationPath src-tauri/dist-cli/rem-cli-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle }}/**
            src-tauri/dist-cli/**
          if-no-files-found: error
          retention-days: 14
