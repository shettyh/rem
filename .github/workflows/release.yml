name: Release

# Normal merges update a Release Please PR. Merging that PR creates a draft
# release, builds every installer, and publishes only after all builds succeed.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_please:
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

      # Pull requests opened with GITHUB_TOKEN do not emit another pull_request
      # event. Dispatch required checks explicitly so the release PR still gets
      # checked without requiring a personal access token.
      - name: Run checks for the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName')
          test -n "$branch" && test "$branch" != "null"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  build:
    if: needs.release_please.outputs.release_created == 'true'
    needs: release_please
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            cli-target: aarch64-apple-darwin
            cli-name: aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
            cli-target: x86_64-apple-darwin
            cli-name: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            cli-target: ''
            cli-name: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            cli-target: ''
            cli-name: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build CLI archive (macOS/Linux)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/dist-cli
          if [ -n "${{ matrix.cli-target }}" ]; then
            cargo build --manifest-path src-tauri/Cargo.toml --release -p rem-cli --target "${{ matrix.cli-target }}"
            binary_dir="src-tauri/target/${{ matrix.cli-target }}/release"
          else
            cargo build --manifest-path src-tauri/Cargo.toml --release -p rem-cli
            binary_dir="src-tauri/target/release"
          fi
          tar -C "$binary_dir" -czf "src-tauri/dist-cli/rem-cli-${{ matrix.cli-name }}.tar.gz" rem

      - name: Build CLI archive (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release -p rem-cli
          New-Item -ItemType Directory -Force src-tauri/dist-cli | Out-Null
          Compress-Archive -Path src-tauri/target/release/rem.exe -DestinationPath src-tauri/dist-cli/rem-cli-${{ matrix.cli-name }}.zip

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Code signing is intentionally OFF (no Apple Developer ID). ---
          # macOS ships ad-hoc signed; the curl installer avoids Gatekeeper
          # quarantine, and the README documents the workaround for manual
          # DMG downloads. To enable real Developer ID signing + notarization
          # later, add these repo secrets and they are picked up automatically:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # NOTE: TAURI_SIGNING_PRIVATE_KEY is for the Tauri auto-updater, not
          # Windows Authenticode — no updater is configured, so it is unused.
        with:
          tagName: ${{ needs.release_please.outputs.tag_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload CLI archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" src-tauri/dist-cli/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    if: needs.release_please.outputs.release_created == 'true'
    needs: [release_please, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "rem $TAG_NAME" --draft=false --latest
