name: Release

# Normal merges update a Release Please PR. Merging that PR creates a draft
# release, builds every installer (with the `rem` CLI bundled inside), generates
# the signed Tauri updater manifest (`latest.json`), publishes the release,
# updates the `shettyh/homebrew-tap` Cask, and uploads the iOS companion build
# to TestFlight.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_please:
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

      # Pull requests opened with GITHUB_TOKEN do not emit another pull_request
      # event. Dispatch required checks explicitly so the release PR still gets
      # checked without requiring a personal access token.
      - name: Run checks for the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName')
          test -n "$branch" && test "$branch" != "null"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  build:
    if: needs.release_please.outputs.release_created == 'true'
    needs: release_please
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            cli-target: aarch64-apple-darwin
            cli-name: aarch64-apple-darwin
            arch-label: aarch64
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
            cli-target: x86_64-apple-darwin
            cli-name: x86_64-apple-darwin
            arch-label: x64
          - platform: ubuntu-22.04
            args: ''
            cli-target: ''
            cli-name: x86_64-unknown-linux-gnu
            arch-label: amd64
          - platform: windows-latest
            args: ''
            cli-target: ''
            cli-name: x86_64-pc-windows-msvc
            arch-label: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Verify updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing required GitHub secret: TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple signing certificate and API key (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PRIVATE_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required GitHub secret for macOS signing/notarization: $var"
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/rem-signing.keychain-db"
          cert_path="$RUNNER_TEMP/apple-cert.p12"
          g2_cert_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          mkdir -p "$RUNNER_TEMP/private_keys"
          api_key_path="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"

          printf '%s' "$APPLE_CERTIFICATE" | tr -d '[:space:]' | base64 --decode > "$cert_path"
          chmod 600 "$cert_path"

          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$g2_cert_path"
          printf '%s  %s\n' \
            "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a" \
            "$g2_cert_path" | shasum -a 256 -c -

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$g2_cert_path" \
            -t cert \
            -k "$keychain_path"
          security import "$cert_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          existing_keychains=()
          while IFS= read -r line; do
            cleaned=$(printf '%s' "$line" | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')
            [ -n "$cleaned" ] && existing_keychains+=("$cleaned")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_path" ${existing_keychains[@]+"${existing_keychains[@]}"}
          security default-keychain -d user -s "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" | grep -F -- "$APPLE_SIGNING_IDENTITY" >/dev/null; then
            echo "::error::Signing identity not found in imported certificate: $APPLE_SIGNING_IDENTITY"
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi

          printf '%s\n' "$APPLE_API_KEY_PRIVATE_KEY" | tr -d '\r' > "$api_key_path"
          chmod 600 "$api_key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$api_key_path"; then
            echo "::error::APPLE_API_KEY_PRIVATE_KEY does not look like a PEM .p8 private key"
            exit 1
          fi

          {
            echo "APPLE_KEYCHAIN_PATH=$keychain_path"
            echo "APPLE_API_KEY_PATH=$api_key_path"
          } >> "$GITHUB_ENV"

      - name: Stage bundled rem CLI sidecar
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.cli-target }}" ]; then
            node tools/stage-cli-sidecar.mjs --target "${{ matrix.cli-target }}"
          else
            node tools/stage-cli-sidecar.mjs
          fi

      - name: Package standalone CLI archive (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/dist-cli
          tar -C src-tauri/target/release -czf "src-tauri/dist-cli/rem-cli-${{ matrix.cli-name }}.tar.gz" rem

      - name: Package standalone CLI archive (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/dist-cli | Out-Null
          Compress-Archive -Path src-tauri/target/release/rem.exe -DestinationPath src-tauri/dist-cli/rem-cli-${{ matrix.cli-name }}.zip

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + App Store Connect API notarization.
          # The certificate is already unlocked in the temporary keychain above;
          # APPLE_API_KEY_PATH is exported into GITHUB_ENV on macOS runners only.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
        with:
          tagName: ${{ needs.release_please.outputs.tag_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Verify macOS signing, notarize DMG, and upload arch-scoped updater & CLI archives (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
          ARCH_LABEL: ${{ matrix.arch-label }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          bundle_dir="src-tauri/target/${{ matrix.cli-target }}/release/bundle"
          app_path="$bundle_dir/macos/rem.app"
          bundled_cli="$app_path/Contents/MacOS/rem"
          test -d "$app_path"
          test -x "$bundled_cli"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$bundled_cli"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          # Upload architecture-distinct updater tarball & signature so arm64 and x64 never collide.
          updater_tar="$bundle_dir/macos/rem.app.tar.gz"
          updater_sig="$bundle_dir/macos/rem.app.tar.gz.sig"
          test -f "$updater_tar"
          test -f "$updater_sig"
          arch_tar="$RUNNER_TEMP/rem_${version}_${ARCH_LABEL}.app.tar.gz"
          arch_sig="$RUNNER_TEMP/rem_${version}_${ARCH_LABEL}.app.tar.gz.sig"
          cp "$updater_tar" "$arch_tar"
          cp "$updater_sig" "$arch_sig"
          gh release upload "$TAG_NAME" "$arch_tar" "$arch_sig" --repo "$GITHUB_REPOSITORY" --clobber

          # Package the already-signed-and-notarized bundled CLI binary as a standalone archive too.
          mkdir -p src-tauri/dist-cli
          tar -C "$app_path/Contents/MacOS" -czf "src-tauri/dist-cli/rem-cli-${{ matrix.cli-name }}.tar.gz" rem

          shopt -s nullglob
          dmgs=("$bundle_dir"/dmg/*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "::error::No DMG found in $bundle_dir/dmg"
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            if ! xcrun stapler validate "$dmg" >/dev/null 2>&1; then
              codesign --force --timestamp \
                --keychain "$APPLE_KEYCHAIN_PATH" \
                --sign "$APPLE_SIGNING_IDENTITY" \
                "$dmg"
              bash tools/macos-notarize.sh "$dmg"
              xcrun stapler staple "$dmg"
              gh release upload "$TAG_NAME" "$dmg" --repo "$GITHUB_REPOSITORY" --clobber
            fi
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      - name: Upload standalone CLI archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" src-tauri/dist-cli/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Clean up Apple signing credentials (macOS)
        if: always() && matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/private_keys"
          rm -f "$RUNNER_TEMP/apple-cert.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

  publish:
    if: needs.release_please.outputs.release_created == 'true'
    needs: [release_please, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and upload deterministic latest.json updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Remove any un-prefixed macOS tarball uploaded by tauri-action so only arch-scoped tarballs exist.
          for redundant in rem.app.tar.gz rem.app.tar.gz.sig rem_aarch64.app.tar.gz rem_aarch64.app.tar.gz.sig rem_x64.app.tar.gz rem_x64.app.tar.gz.sig; do
            gh release delete-asset "$TAG_NAME" "$redundant" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done

          sig_dir="$RUNNER_TEMP/release-sigs"
          mkdir -p "$sig_dir"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" -p '*.sig' -D "$sig_dir"

          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > "$notes_file"

          node tools/generate-updater-manifest.mjs \
            --version "$TAG_NAME" \
            --tag "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --assets-dir "$sig_dir" \
            --notes-file "$notes_file" \
            --output "$RUNNER_TEMP/latest.json"

          cat "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "rem $TAG_NAME" --draft=false --latest

  update_homebrew:
    if: needs.release_please.outputs.release_created == 'true'
    needs: [release_please, publish]
    runs-on: ubuntu-22.04
    steps:
      - name: Check Homebrew tap token
        id: tap_auth
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping automatic shettyh/homebrew-tap Cask update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.tap_auth.outputs.enabled == 'true'
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        if: steps.tap_auth.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Checkout shettyh/homebrew-tap
        if: steps.tap_auth.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: shettyh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew Cask for new release
        if: steps.tap_auth.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          dmg_dir="$RUNNER_TEMP/homebrew-dmgs"
          mkdir -p "$dmg_dir"

          arm_dmg="rem_${version}_aarch64.dmg"
          intel_dmg="rem_${version}_x64.dmg"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" -p "$arm_dmg" -p "$intel_dmg" -D "$dmg_dir"

          arm_sha=$(sha256sum "$dmg_dir/$arm_dmg" | awk '{print $1}')
          intel_sha=$(sha256sum "$dmg_dir/$intel_dmg" | awk '{print $1}')

          mkdir -p homebrew-tap/Casks
          node tools/render-homebrew-cask.mjs \
            --version "$version" \
            --arm-sha256 "$arm_sha" \
            --intel-sha256 "$intel_sha" \
            --repo "$GITHUB_REPOSITORY" \
            --output homebrew-tap/Casks/rem.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rem.rb
          if git diff --cached --quiet; then
            echo "Casks/rem.rb is already up to date."
          else
            git commit -m "Update rem cask to v${version}"
            git push
          fi

  ios_testflight:
    if: needs.release_please.outputs.release_created == 'true'
    needs: release_please
    uses: ./.github/workflows/ios-testflight.yml
    with:
      tag_name: ${{ needs.release_please.outputs.tag_name }}
    secrets: inherit
