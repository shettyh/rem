name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (test · build)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test release installer selection and tooling
        run: sh tools/test-install.sh && node tools/test-release-tools.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test (unit + browser)
        run: npm test

      # `npm run build` is `tsc --noEmit && vite build`, so this also typechecks.
      - name: Build
        run: npm run build

  sync-server:
    name: Sync Server (Cloudflare Workers)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sync-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest-pool-workers)
        run: npm test

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        run: cargo audit

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  ios:
    name: iOS (xcframework · test)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ios-sim-debug

      - name: Build RemCore.xcframework (simulator) & Swift bindings
        run: bash tools/build-ios-xcframework.sh --debug --sim-only

      - name: Select available iPhone Simulator
        id: simulator
        run: |
          set -euo pipefail
          sim_udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted(
              (rt for rt in data.keys() if "iOS" in rt),
              key=lambda rt: tuple(int(n) for n in re.findall(r"\d+", rt)),
              reverse=True,
          )
          for rt in runtimes:
              iphones = [d for d in data[rt] if d.get("isAvailable") and "iPhone" in d.get("name", "")]
              if iphones:
                  print(iphones[0]["udid"])
                  sys.exit(0)
          sys.exit(1)
          ')
          echo "Selected simulator UDID: $sim_udid"
          echo "udid=$sim_udid" >> "$GITHUB_OUTPUT"

      - name: Build and test iOS app
        run: |
          set -euo pipefail
          # Skip the local SKTestSession purchase-sheet test on headless GitHub
          # Actions simulators: `SKTestSession` fails with `SKInternalErrorDomain Code=3`
          # under headless `xcodebuild test`, leaving `disableDialogs = true` inactive
          # so `product.purchase()` blocks forever waiting on the confirmation sheet.
          # Run it locally in Xcode; all other StoreKit/entitlement unit tests run here.
          xcodebuild test \
            -project ios/Rem.xcodeproj \
            -scheme RemApp \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/RemAppTests.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -skip-testing:RemAppTests/RemAppTests/testStoreKitPurchaseAndRestoreFlowWithLocalConfiguration \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
