[workspace]
members = [".", "crates/rem-sync-reduce", "crates/rem-core", "crates/rem-cli", "crates/rem-sync", "crates/rem-ffi"]
default-members = [".", "crates/rem-sync-reduce", "crates/rem-core", "crates/rem-cli", "crates/rem-sync", "crates/rem-ffi"]
resolver = "2"

[package]
name = "app"
version = "0.32.3"
default-run = "app"
description = "Desktop application for rem spaced repetition"
authors = ["Manjunatha Shetty H"]
license = "Apache-2.0"
repository = "https://github.com/shettyh/rem"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
rem-core = { path = "crates/rem-core" }
rem-sync = { path = "crates/rem-sync" }
