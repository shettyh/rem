[workspace]
members = [".", "crates/rem-core", "crates/rem-cli"]
default-members = [".", "crates/rem-core", "crates/rem-cli"]
resolver = "2"

[package]
name = "app"
version = "0.8.0"
default-run = "app"
description = "A Tauri App"
authors = ["you"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
base64 = "0.23"
fsrs = "6.6.1"
rem-core = { path = "crates/rem-core" }
