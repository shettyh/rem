[package]
name = "rem-cli"
version = "0.11.0"
description = "Terminal interface for rem"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "rem"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.4", features = ["derive"] }
crossterm = "0.27"
pulldown-cmark = { version = "0.10.3", default-features = false }
ratatui = "0.26.3"
rem-core = { path = "../rem-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3"
