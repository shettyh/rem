[package]
name = "rem-cli"
version = "0.12.2"
description = "Terminal interface for rem"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "rem"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = "0.29"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
rem-core = { path = "../rem-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3"
