[package]
name = "rem-ffi"
version = "0.19.0"
description = "UniFFI Swift bindings for rem-core and rem-sync"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "rem_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
chrono = "0.4"
rem-core = { path = "../rem-core" }
rem-sync = { path = "../rem-sync", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
tempfile = "3"
