[package]
name = "rem-sync"
version = "0.15.0"
description = "Cloud sync client and asset uploader for rem"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
rem-core = { path = "../rem-core" }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
