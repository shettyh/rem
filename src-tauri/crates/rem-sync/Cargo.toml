[package]
name = "rem-sync"
version = "0.25.0"
description = "Cloud sync client, OAuth/Keychain auth, and asset uploader for rem"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dependencies]
base64 = "0.23"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rem-core = { path = "../rem-core" }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
