[package]
name = "rem-core"
version = "0.13.0"
description = "Shared collection and review domain for rem"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
chrono = "0.4"
directories = "6.0"
fsrs = "6.6.1"
hex = "0.4"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
