[package]
name = "rem-core"
version = "0.32.1"
description = "Shared collection and review domain for rem"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
chrono = "0.4"
directories = "6.0"
fsrs = "7.0.0"
hex = "0.4"
rand = "0.10"
rem-sync-reduce = { path = "../rem-sync-reduce" }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint", "collation", "hooks"] }
ruzstd = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1.0", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"
