name: Rem
options:
  bundleIdPrefix: com.shettyh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  RemApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RemApp
        excludes:
          - "**/*.md"
    dependencies:
      - framework: Frameworks/RemCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: AuthenticationServices.framework
      - sdk: UserNotifications.framework
      - sdk: StoreKit.framework
    entitlements:
      path: RemApp/Resources/RemApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: RemApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: rem
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.shettyh.rem.auth
            CFBundleURLSchemes:
              - rem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shettyh.rem
        PRODUCT_NAME: rem
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
          - "-framework"
          - "SystemConfiguration"

  RemAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RemAppTests
    dependencies:
      - target: RemApp
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shettyh.rem.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/rem.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/rem"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  RemApp:
    build:
      targets:
        RemApp: all
        RemAppTests: [test]
    run:
      config: Debug
      storeKitConfiguration: RemAppTests/RemPremium.storekit
    test:
      config: Debug
      targets:
        - RemAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
