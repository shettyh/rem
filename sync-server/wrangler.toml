name = "rem-sync-server"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[vars]
MAX_ASSET_BYTES = "10485760"
MAX_USER_QUOTA_BYTES = "524288000"
COMPACT_AFTER_OPS = "5000"
RETAIN_TAIL_OPS = "2000"
RETAIN_TAIL_DAYS = "30"
ENABLE_OP_PRUNING = "false"
ASSET_GC_GRACE_DAYS = "30"

[triggers]
crons = ["0 3 * * *"]

[[durable_objects.bindings]]
name = "USER_SYNC"
class_name = "UserSyncDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSyncDO"]

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "rem-sync-assets"

[[d1_databases]]
binding = "DB"
database_name = "rem-sync-auth"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
